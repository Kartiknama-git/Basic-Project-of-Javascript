<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Of Tiles</title>
    <style>
        :root {
            --bg-color: #373f39;
            --tile-color: #9a6406;
            --text-color: #ecf0f1;
            --accent-color: #86732d;
            --empty-color: #373f39;
            --cont-color: #c1b27e;
            --btn-color: #685923;
        }

        .theme-1 {
            --bg-color: #373f39;
            --tile-color: #9a6406;
            --text-color: #ecf0f1;
            --accent-color: #86732d;
            --empty-color: #373f39;
            --cont-color: #c1b27e;
            --btn-color: #5c4d18;
        }

        .theme-2 {
            --bg-color: #f5f5f5;
            --tile-color: #3498db;
            --text-color: #2c3e50;
            --accent-color: #2980b9;
            --empty-color: #dfe6e9;
            --cont-color: #6eb6d0a3;
            --btn-color: #14405d;
        }

        .theme-3 {
            --bg-color: #581d2c;
            --tile-color: #e3788a;
            --text-color: #ffffff;
            --accent-color: #600f32;
            --empty-color: #813945;
            --cont-color: #b53449;
            --btn-color: #685923;
        }

        .theme-4 {
            --bg-color: #0f2027;
            --tile-color: #2c5364;
            --text-color: #e0f7fa;
            --accent-color: #203a43;
            --empty-color: #203a43;
            --cont-color: #256378;
            --btn-color: #685923;
        }

        .theme-5 {
            --bg-color: #fff8e1;
            --tile-color: #ffb300;
            --text-color: #4e342e;
            --accent-color: #ff6f00;
            --empty-color: #ffe0b2;
            --cont-color: #6c4d05b8;
            --btn-color: #685923;
        }

        .theme-6{
            --bg-color: #151515;
            --tile-color: #244c04;
            --text-color: #ffffff;
            --accent-color: #52c500;
            --empty-color: #568f55f0;
            --cont-color: #52c500;
            --btn-color: #685923;
        }

        .theme-7{
            --bg-color: #000000;
            --tile-color: #757575;
            --text-color: #d2d2d2;
            --accent-color: #828282;
            --empty-color: #232423f0;
            --cont-color: #4a4a4a;
            --btn-color: #685923;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        p {
            margin-top: -40px;
            font-size: 45px;
            font-weight: 600;
            text-transform: uppercase;
        }

        marquee {
            font-family: cursive;
            font-size: 22px;
            /* text-decoration: underline; */
            color: rgba(255, 162, 0, 0.941);
            letter-spacing: 1.4px;
            font-weight: 600;
        }

        select {
            background-color: var(--bg-color);
            border-radius: 40px;
            border: none;
            color: var(--text-color);
            font-size: 1.2rem;
            font-weight: bold;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        #game-container {
            display: grid;
            gap: 8px;
            background-color: var(--cont-color);
            padding: 10px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 1);
            width: 90vw;
            max-width: 400px;
            aspect-ratio: 1/1;
        }

        .tile {
            width: 100%;
            height: 100%;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            background-color: var(--tile-color);
            color: white;
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.9rem;
            cursor: pointer;
            /* transition: all 0.2s ease; */
            transition: transform 0.2s ease, background 0.3s;
            box-shadow: inset -10px 10px 20px rgba(0, 0, 0, 1);
            border-radius: 16%;
        }

        .tile:active {
            transform: scale(0.90);
        }

        .tile.empty {
            background-color: var(--empty-color);
            cursor: default;
            box-shadow: none;
            box-shadow: inset -10px 10px 20px rgba(0, 0, 0, 1);

        }

        button {
            margin-top: 30px;
            padding: 8px 26px;
            font-size: 1rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            /* text-transform: uppercase; */
            letter-spacing: 1px;
            transition: background 0.3s;
            box-shadow: 10px 10px 20px rgba(0, 0, 0, 1);
        }

        button:hover {
            background-color: rgba(77, 77, 77, 0.563);
            box-shadow: inset -7px 7px 10px rgb(0, 0, 0);
            transition: 0.8s all ease;

        }

        button:active {
            transform: scale(0.8);
            transition: 0.5s all ease;
        }

        .divx {
            display: flex;
            gap: 20px;
        }

        .bs1,
        #best-score {
            font-size: 23px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-weight: 600;
            margin-top: 10px;
        }

        .win {
            animation: winAnim 0.8s ease;
        }

        .confetti {
            position: fixed;
            top: -10px;
            width: 8px;
            height: 14px;
            opacity: 0.9;
            z-index: 999;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        @keyframes winAnim {
            0% {
                transform: scale(1);
                background-color: gold;
            }

            50% {
                transform: scale(1.2);
                background-color: limegreen;
            }

            100% {
                transform: scale(1);
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 32px;
            }

            .stats {
                font-size: 1.1rem;
                gap: 10px;
                flex-wrap: wrap;
                justify-content: center;
            }

            button {
                width: 80%;
            }
        }
    </style>
</head>

<body>
    <p>Game Of Tiles</p>
    <marquee behavior="alternate">Kartik's Project</marquee> <br>
    <div class="stats">
        <select id="difficulty" onchange="changeDifficulty()">
            <option value="3">Easy (3x3)</option>
            <option value="4">Medium (4x4)</option>
            <option value="5">Hard (5x5)</option>
        </select>
        <span>Moves: <span id="move-count">0</span></span>
        <span>Time: <span id="timer">00:00</span></span>
    </div>
    <div id="game-container"></div>
    <span class="bs1">Best Moves: <span id="best-score">- -</span></span>
    <div class="divx">
        <button onclick="toggleTheme()">Theme Change</button>
        <button onclick="resetGame()">Shuffle</button>
    </div>
    <script>
        const container = document.getElementById('game-container');
        const moveDisplay = document.getElementById('move-count');
        const timerDisplay = document.getElementById('timer');
        // let tiles = [1, 2, 3, 4, 5, 6, 7, 8, null];
        let tiles = [];

        function generateTiles() {
            tiles = [];
            for (let i = 1; i < gridSize * gridSize; i++) {
                tiles.push(i);
            }
            tiles.push(null);
        }
        let moves = 0;
        let seconds = 0;
        let timerInterval = null;
        let gameStarted = false;
        let gridSize = 3;

        function createBoard() {
            container.innerHTML = '';
            container.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            container.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;
            tiles.forEach((tile, index) => {
                const tileDiv = document.createElement('div');
                tileDiv.classList.add('tile');
                if (tile === null) {
                    tileDiv.classList.add('empty');
                } else {
                    tileDiv.textContent = tile;
                    tileDiv.onclick = () => moveTile(index);
                }
                container.appendChild(tileDiv);
            });
        }

        function moveTile(index) {
            const emptyIndex = tiles.indexOf(null);
            if (isAdjacent(index, emptyIndex)) {
                if (navigator.vibrate) {
                    navigator.vibrate(60);
                }
                swap(index, emptyIndex);
                if (gameStarted) {
                    moves++;
                    moveDisplay.textContent = moves;
                    checkWin();
                }
                createBoard();
            }
        }

        function isAdjacent(idx1, idx2) {
            const row1 = Math.floor(idx1 / gridSize), col1 = idx1 % gridSize;
            const row2 = Math.floor(idx2 / gridSize), col2 = idx2 % gridSize;
            return Math.abs(row1 - row2) + Math.abs(col1 - col2) === 1;
        }

        function swap(idx1, idx2) {
            [tiles[idx1], tiles[idx2]] = [tiles[idx2], tiles[idx1]]
        }

        let currentTheme = 0;

        const themes = [
            'theme-1',
            'theme-2',
            'theme-3',
            'theme-4',
            'theme-5',
            'theme-6',
            'theme-7'
        ];

        function toggleTheme() {
            // remove all themes
            themes.forEach(t => document.body.classList.remove(t));

            // next theme
            currentTheme = (currentTheme + 1) % themes.length;

            // apply new theme
            document.body.classList.add(themes[currentTheme]);

            // save
            localStorage.setItem('themeIndex', currentTheme);
        }

        function loadTheme() {
            const savedIndex = localStorage.getItem('themeIndex');

            if (savedIndex !== null) {
                currentTheme = parseInt(savedIndex);
                document.body.classList.add(themes[currentTheme]);
            } else {
                document.body.classList.add(themes[0]);
            }
        }

        loadTheme();

        function resetGame() {
            moves = 0;
            seconds = 0;
            gameStarted = false;
            moveDisplay.textContent = moves;
            timerDisplay.textContent = "00:00";
            clearInterval(timerInterval);
            generateTiles();

            for (let i = 0; i < 200; i++) {
                const emptyIdx = tiles.indexOf(null);
                const neighbors = [];

                if (emptyIdx % gridSize > 0) neighbors.push(emptyIdx - 1);
                if (emptyIdx % gridSize < gridSize - 1) neighbors.push(emptyIdx + 1);
                if (emptyIdx >= gridSize) neighbors.push(emptyIdx - gridSize);
                if (emptyIdx < gridSize * (gridSize - 1)) neighbors.push(emptyIdx + gridSize);

                const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
                swap(emptyIdx, randomNeighbor);
            }

            gameStarted = true;
            createBoard();
            startTimer();
            loadBestScore();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                seconds++;
                const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
                const secs = String(seconds % 60).padStart(2, '0');
                timerDisplay.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        const bestDisplay = document.getElementById('best-score');

        function loadBestScore() {
            const best = localStorage.getItem(`best-${gridSize}`);
            bestDisplay.textContent = best ? best : '--';
        }

        function saveBestScore() {
            const key = `best-${gridSize}`;
            const best = localStorage.getItem(key);

            if (!best || moves < best) {
                localStorage.setItem(key, moves);
            }
        }

        function checkWin() {
            const win = tiles.slice(0, -1).every((v, i) => v === i + 1) && tiles[tiles.length - 1] === null;

            if (win) {
                gameStarted = false;
                clearInterval(timerInterval);

                saveBestScore();
                loadBestScore();

                // 🎉 animation
                document.querySelectorAll('.tile').forEach(tile => {
                    tile.classList.add('win');
                });

                launchConfetti();

                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

                setTimeout(() => {
                    alert(`Winner! Moves: ${moves} Time: ${timerDisplay.textContent}`);
                }, 1700);
            }
        }

        function launchConfetti() {
            const colors = ['#ff0', '#ff5733', '#33ff57', '#3399ff', '#ff33a8'];

            for (let i = 0; i < 120; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');

                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.width = (Math.random() * 6 + 4) + 'px';
                confetti.style.height = (Math.random() * 10 + 6) + 'px';

                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 4000);
            }
        }

        function changeDifficulty() {
            gridSize = parseInt(document.getElementById('difficulty').value);
            resetGame();
        }
        generateTiles();
        createBoard();
    </script>
</body>

</html>
