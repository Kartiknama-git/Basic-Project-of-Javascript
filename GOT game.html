<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Of Tiles</title>
    <style>
        :root {
            --bg-color: #6c6e6d;
            --tile-color: #a67a0b;
            --text-color: #ecf0f1;
            --accent-color: #86732d;
            --empty-color: #6c6e6d;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            margin-top: -20px;
            font-size: 50px;
            margin-bottom: -0.01px;
        }
        select{
            background-color: #6c6e6d;
            /* border-radius: 40px; */
            border: none;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        #game-container {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 8px;
            background-color: #c1b27e;
            padding: 10px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 1);
        }

        .tile {
            width: 94px;
            height: 94px;
            background-color: var(--tile-color);
            color: white;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: inset -10px 10px 20px rgba(0, 0, 0, 1);
        }

        .tile:active {
            transform: scale(0.90);
        }

        .tile.empty {
            background-color: var(--empty-color);
            cursor: default;
            box-shadow: none;
            box-shadow: inset -10px 10px 20px rgba(0, 0, 0, 1);

        }

        button {
            margin-top: 30px;
            padding: 12px 24px;
            font-size: 1rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s;
            box-shadow: 10px 10px 20px rgba(0, 0, 0, 1);
        }

        button:hover {
            background-color: #685923;
            box-shadow: inset -7px 7px 10px rgb(0, 0, 0);
            transition: 0.8s all ease;

        }
        button:active{
            transform: scale(0.8);
            transition: 0.5s all ease;
        }
    </style>
</head>

<body>
    <h1>Game Of Tiles</h1>
    {Kartik's Project}<br>
    <div class="stats">
        <select id="difficulty" onchange="changeDifficulty()">
            <option value="3">Easy (3x3)</option>
            <option value="4">Medium (4x4)</option>
            <option value="5">Hard (5x5)</option>
        </select>
        <span>Moves: <span id="move-count">0</span></span>
        <span>Time: <span id="timer">00:00</span></span>
    </div>
    <div id="game-container"></div>
    <button onclick="resetGame()">Shuffle & Start</button>
    <script>
        const container = document.getElementById('game-container');
        const moveDisplay = document.getElementById('move-count');
        const timerDisplay = document.getElementById('timer');
        // let tiles = [1, 2, 3, 4, 5, 6, 7, 8, null];
        let tiles = [];

        function generateTiles() {
            tiles = [];
            for (let i = 1; i < gridSize * gridSize; i++) {
                tiles.push(i);
            }
            tiles.push(null);
        }
        let moves = 0;
        let seconds = 0;
        let timerInterval = null;
        let gameStarted = false;
        let gridSize = 3;

        function createBoard() {
            container.innerHTML = '';
            container.style.gridTemplateColumns = `repeat(${gridSize}, 100px)`;
            container.style.gridTemplateRows = `repeat(${gridSize}, 100px)`;
            tiles.forEach((tile, index) => {
                const tileDiv = document.createElement('div');
                tileDiv.classList.add('tile');
                if (tile === null) {
                    tileDiv.classList.add('empty');
                } else {
                    tileDiv.textContent = tile;
                    tileDiv.onclick = () => moveTile(index);
                }
                container.appendChild(tileDiv);
            });
        }

        function moveTile(index) {
            const emptyIndex = tiles.indexOf(null);
            if (isAdjacent(index, emptyIndex)) {
                swap(index, emptyIndex);
                if (gameStarted) {
                    moves++;
                    moveDisplay.textContent = moves;
                    checkWin();
                }
                createBoard();
            }
        }

        function isAdjacent(idx1, idx2) {
            const row1 = Math.floor(idx1 / gridSize), col1 = idx1 % gridSize;
            const row2 = Math.floor(idx2 / gridSize), col2 = idx2 % gridSize;
            return Math.abs(row1 - row2) + Math.abs(col1 - col2) === 1;
        }

        function swap(idx1, idx2) {
            [tiles[idx1], tiles[idx2]] = [tiles[idx2], tiles[idx1]]
        }

        function resetGame() {
            moves = 0;
            seconds = 0;
            gameStarted = false;
            moveDisplay.textContent = moves;
            timerDisplay.textContent = "00:00";
            clearInterval(timerInterval);
            generateTiles();

            for (let i = 0; i < 200; i++) {
                const emptyIdx = tiles.indexOf(null);
                const neighbors = [];

                if (emptyIdx % gridSize > 0) neighbors.push(emptyIdx - 1);
                if (emptyIdx % gridSize < gridSize - 1) neighbors.push(emptyIdx + 1);
                if (emptyIdx >= gridSize) neighbors.push(emptyIdx - gridSize);
                if (emptyIdx < gridSize * (gridSize - 1)) neighbors.push(emptyIdx + gridSize);

                const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
                swap(emptyIdx, randomNeighbor);
            }

            gameStarted = true;
            createBoard();
            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                seconds++;
                const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
                const secs = String(seconds % 60).padStart(2, '0');
                timerDisplay.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function checkWin() {
            const win = tiles.slice(0, -1).every((v, i) => v === i + 1) && tiles[tiles.length - 1] === null;
            if (win) {
                gameStarted = false;
                clearInterval(timerInterval);
                setTimeout(() => alert(`Winner! Moves: ${moves} Time: ${timerDisplay.textContent}`), 200);
            }
        }

        function changeDifficulty() {
            gridSize = parseInt(document.getElementById('difficulty').value);
            resetGame();
        }
        generateTiles();
        createBoard();
    </script>
</body>

</html>
