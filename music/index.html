<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Harmony Flow | Premium Music Player</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="player-container" id="playerApp">
        <div class="top-bar">
            <div class="now-playing-badge"><i class="fas fa-headphones" style="margin-right: 4px;"></i>NAMA-Ji PREMIUM
                STREAM
            </div>
            <button class="theme-toggle-btn" id="themeSwitcherBtn"><i class="fas fa-palette"></i></button>
        </div>

        <div class="artwork-wrapper">
            <img id="coverArt" class="cover" src="https://picsum.photos/id/29/400/400" alt="album cover">
        </div>

        <div class="song-info">
            <h2 class="song-title" id="songTitle">Levitating</h2>
            <p class="artist-name" id="artistName">Dua Lipa</p>
        </div>

        <!-- Wave animation bars (synced with volume / play state) -->
        <div class="waveform-visualizer" id="waveVisualizer">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
        </div>

        <div class="controls">
            <button class="ctrl-btn" id="prevBtn"><i class="fas fa-backward-step"></i></button>
            <button class="ctrl-btn play-btn" id="playPauseBtn"><i class="fas fa-play" id="playIcon"></i></button>
            <button class="ctrl-btn" id="nextBtn"><i class="fas fa-forward-step"></i></button>
        </div>

        <div class="progress-section">
            <div class="time-row">
                <span id="currentTime">0:00</span>
                <span id="totalDuration">0:00</span>
            </div>
            <input type="range" id="progressSlider" value="0" step="0.1">
        </div>

        <div class="volume-container">
            <i class="fas fa-volume-up"></i>
            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.7">
        </div>

        <div class="playlist-title">
            <i class="fas fa-list-ul"></i> QUEUE · PLAYLIST
        </div>
        <ul class="playlist-songs" id="playlistContainer"></ul>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
